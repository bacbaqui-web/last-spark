name: Update shared survival records
on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  actions: write
concurrency:
  group: shared-records
  cancel-in-progress: false
jobs:
  records:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Last Spark Record]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const {parseRecord,renderRecords}=require(process.env.GITHUB_WORKSPACE+'/scripts/shared-records.cjs');
            const repo={owner:context.repo.owner,repo:context.repo.repo};
            const issues=await github.paginate(github.rest.issues.listForRepo,{...repo,state:'all',per_page:100});
            const records=issues.map(parseRecord).filter(Boolean).sort((a,b)=>b.time-a.time||b.wave-a.wave||b.kills-a.kills||a.issue-b.issue);
            let changed=false;
            for(const [path,text]of [['docs/records.md',renderRecords(records)],['public/records.json',JSON.stringify(records,null,2)+'\n']]){
              const current=await github.rest.repos.getContent({...repo,path,ref:'main'});
              const content=Buffer.from(text).toString('base64');
              if(Buffer.from(current.data.content,'base64').toString()===text)continue;
              await github.rest.repos.createOrUpdateFileContents({...repo,path,message:'Update shared survival records',content,sha:current.data.sha,branch:'main'});
              changed=true;
            }
            if(changed)await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'deploy.yml',ref:'main'});
