name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore game runtime models from published game build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download city-runtime-20261006 --repo "${{ github.repository }}" --pattern last-spark-game.zip --dir "$RUNNER_TEMP/game-runtime"
          unzip -q "$RUNNER_TEMP/game-runtime/last-spark-game.zip" 'atomic/*' -d public
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
