<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LAST SPARK · 철갑 콩벌레</title><style>body{margin:0;background:#131a16;color:#e4e7dc;font-family:system-ui}header{padding:20px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:4px 0}small{color:#a8ba8b}a{color:#c6d9a7}#view{height:72vh;min-height:380px;position:relative}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:18px;left:28px;padding:10px 15px;background:#162018dd;border:1px solid #54644a;border-radius:8px}footer{padding:18px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#2d3c2b;color:#ecf0e3;border:1px solid #687758;padding:10px 16px;border-radius:6px;font-size:14px}p{margin:4px 28px 20px;color:#b9c5ac}#hit{color:#ffb675}label{display:flex;gap:8px;align-items:center}</style></head><body><header><div><small>LAST SPARK / WILD ROBOT MOTION STUDY</small><h1>철갑 콩벌레 · 돌진 동작</h1></div><a href="./wild-robot-lab.html">야생 로봇 작업실 ↗</a></header><div id="view"><div id="status"></div></div><footer><button id="restart">처음부터</button><button id="pause">일시정지</button><label>재생 속도 <select id="speed"><option value="1">보통</option><option value="0.35">느리게</option></select></label><label>충돌 대상 <select id="collision"><option value="player">플레이어</option><option value="wall">벽</option></select></label><label>단계 보기 <select id="phase"><option value="0">기어다니기</option><option value="2.32">도약·변형</option><option value="2.95">회전 충전</option><option value="3.55">돌진</option><option value="4.7">배 노출·발버둥</option><option value="7">점프 복귀</option></select></label><button id="shoot">콩벌레에 사격</button><span id="hit">초록 표적은 플레이어 위치입니다.</span></footer><p>6개 등판·6개 다리 → 붉은 경로 예고 → 도약하며 공으로 변형 → 회전 충전 → 폭발적인 무적 돌진 → 충돌 반동·뒤집힘 → 배 노출 중에만 공격 가능 → 무적 복귀. 드래그로 회전하고 휠로 확대할 수 있습니다.</p><script type="module" src="./pillbug-lab.js"></script></body></html>
